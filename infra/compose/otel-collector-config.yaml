# NIRVA local OpenTelemetry collector — LOCAL ONLY, never a cloud backend.
# Receives OTLP from api/web, exports to file + in-collector metrics for the
# offline dashboard. No internet exporters permitted (sovereignty is binary).

receivers:
  otlp:
    protocols:
      grpc:
        endpoint: 0.0.0.0:4317
      http:
        endpoint: 0.0.0.0:4318

processors:
  batch:
    timeout: 5s
    send_batch_size: 512

extensions:
  health_check:
    endpoint: 0.0.0.0:13133

exporters:
  file/local-traces:
    path: /var/lib/otelcol/traces.jsonl
    rotation:
      max_megabytes: 100
      max_backups: 3
  file/local-metrics:
    path: /var/lib/otelcol/metrics.jsonl
    rotation:
      max_megabytes: 100
      max_backups: 3
  debug:
    verbosity: basic

service:
  extensions: [health_check]
  pipelines:
    traces:
      receivers: [otlp]
      processors: [batch]
      exporters: [file/local-traces, debug]
    metrics:
      receivers: [otlp]
      processors: [batch]
      exporters: [file/local-metrics, debug]
