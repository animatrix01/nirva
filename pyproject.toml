# Shared lane tooling config (no [project] table; packaging lives per-package).
# Owned by api lane for Phase 1; other lanes may extend their sections via proposal.

[tool.ruff]
line-length = 120
target-version = "py311"
extend-exclude = [".venv", "node_modules", "data/raw", "data/synthetic/generate_corpus.py"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP", "B"]

[tool.ruff.lint.per-file-ignores]
"scripts/phase*_live_check.py" = ["E501"]
"scripts/integration_check.py" = ["E501"]
"scripts/_dbg_retriever.py" = ["E501"]

[tool.mypy]
python_version = "3.12"
disallow_untyped_defs = true
no_implicit_optional = true
warn_redundant_casts = true
exclude = ['\.venv', 'migrations/env\.py']

[tool.pytest.ini_options]
testpaths = [
    "apps/api/tests",
    "packages/agent/tests",
    "packages/retrieval/tests",
    "packages/tools/tests",
]
asyncio_mode = "auto"
addopts = "-q"
