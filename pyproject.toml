# Shared lane tooling config (no [project] table; packaging lives per-package).
# Owned by api lane for Phase 1; other lanes may extend their sections via proposal.

[tool.ruff]
line-length = 100
target-version = "py311"
extend-exclude = [".venv", "node_modules", "data/raw"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP", "B"]

[tool.mypy]
python_version = "3.11"
disallow_untyped_defs = true
no_implicit_optional = true
warn_redundant_casts = true
exclude = ['\.venv', 'migrations/env\.py']

[tool.pytest.ini_options]
testpaths = ["apps/api/tests", "packages/tools/tests"]
addopts = "-q"
