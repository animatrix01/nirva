[project]
name = "nirva-agent"
version = "0.1.0"
description = "NIRVA agent lane: LangGraph investigation graph and model-gateway client"
requires-python = ">=3.12"
dependencies = [
    "httpx>=0.28",
    "pydantic>=2.13",
]

[project.optional-dependencies]
graph = [
    "langgraph>=1.2",
    "langgraph-checkpoint-postgres>=3.1",
    "psycopg[binary,pool]>=3.2",
]
dev = [
    "ruff>=0.16",
    "mypy>=2.3",
    "pytest>=9.1",
    "pytest-asyncio>=1.4",
    "respx>=0.23",
]

[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]

[tool.ruff]
line-length = 120
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]

[tool.mypy]
python_version = "3.12"
strict = true
mypy_path = "src"
packages = ["nirva_agent"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"

[tool.pyright]
skip = true
